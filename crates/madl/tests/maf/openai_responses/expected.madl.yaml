madl: draft
system:
  id: Assistant
  name: Assistant
  description: Helpful assistant
defaults:
  preferences:
    runtime: microsoft-agent-framework
inputs:
- id: user-message
  to:
  - Assistant
agents:
- id: Assistant
  description: Helpful assistant
  instructions: You are a helpful assistant. You answer questions in the language specified by the user. You return your answers in a JSON format. You must include Responses as the type in your response.
  model: openai/gpt-4.1-mini
  settings:
    preferences:
      options:
        apiType: Responses
        temperature: 0.9
        topP: 0.95
  extensions:
    com.microsoft.agent-framework:
      connection:
        apiKey: =Env.OPENAI_API_KEY
        kind: key
      outputSchema:
        properties:
          answer:
            description: The answer text.
            kind: string
            required: true
          language:
            description: The language of the answer.
            kind: string
            required: true
          type:
            description: The type of the response.
            kind: string
            required: true
