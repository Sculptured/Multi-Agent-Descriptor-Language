madl: draft
system:
  id: root_agent
  name: root_agent
  description: Coordinator agent to greet users.
defaults:
  preferences:
    runtime: google-adk
inputs:
- id: user-message
  to:
  - root_agent
agents:
- id: root_agent
  description: Coordinator agent to greet users.
  instructions: |
    You are a helpful assistant that can roll dice and check if numbers are prime.

    You delegate rolling dice tasks to the roll_agent and prime checking tasks to the prime_agent.

    Follow these steps:
    1. If the user asks to roll a die, delegate to the roll_agent.
    2. If the user asks to check primes, delegate to the prime_agent.
    3. If the user asks to roll a die and then check if the result is prime, call roll_agent first, then pass the result to prime_agent.

    Always clarify the results before proceeding.
  model: google/gemini-2.5-flash
  tools:
  - id: example_tool
    builtin: google-adk:multi_agent_llm_config.example_tool
  settings:
    preferences:
      options:
        generate_content_config:
          safety_settings:
          - category: HARM_CATEGORY_DANGEROUS_CONTENT
            threshold: OFF
- id: roll_agent
  description: Handles rolling dice of different sizes.
  instructions: |
    You are responsible for rolling dice based on the user's request.

    When asked to roll a die, you must call the roll_die tool with the number of sides as an integer.
  model: google/gemini-2.5-flash
  tools:
  - id: roll_die
    builtin: google-adk:multi_agent_llm_config.roll_die
- id: prime_agent
  description: Handles checking if numbers are prime.
  instructions: |
    You are responsible for checking whether numbers are prime.
    When asked to check primes, you must call the check_prime tool with a list of integers.
    Never attempt to determine prime numbers manually.
    Return the prime number results to the root agent.
  model: google/gemini-2.5-flash
  tools:
  - id: check_prime
    builtin: google-adk:multi_agent_llm_config.check_prime
connections:
- from: root_agent
  to: roll_agent
  kind: delegate
- from: root_agent
  to: prime_agent
  kind: delegate
- from: roll_agent
  to: root_agent
  kind: report
- from: roll_agent
  to: prime_agent
  kind: handoff
  direction: both
- from: prime_agent
  to: root_agent
  kind: report
communication:
  mode: closed
